name: CI

# Until this existed, every check ran on somebody's laptop and blocked them for
# twenty minutes. Three jobs, deliberately separate:
#
#   checks  — lint, types, build, and the PURE tests. No database, so it is safe
#             to run many at once and safe to cancel when a newer push
#             supersedes it. ~3 minutes. THIS is what gates a merge.
#   migrations
#           — refuses a pull request that ADDS a drizzle/*.sql without the
#             `full-tests` label. Seconds, no database. It exists because
#             nothing in the deploy applies migrations and nothing here can
#             tell whether a person did — see ADR 0014, and the block above
#             the job itself.
#   tests   — the database suite. Shares ONE Neon branch with every other run, so
#             it is serialised repo-wide and must never be cancelled midway.
#             ~12 minutes, and it now runs AFTER a merge rather than before.
#
# WHY THE DATABASE SUITE NO LONGER BLOCKS A PULL REQUEST (2026-08-09).
#
# It was costing about fifteen minutes of waiting per merge, and the founder was
# paying that on every slice of a ten-slice module. Three things made it the
# wrong trade:
#
#   1. It is almost entirely the `db` vitest project, which is deliberately
#      sequential (one Neon branch, and several files assert what is NOT visible
#      across a tenant boundary). The 46 pure files finish in seconds.
#   2. It DUPLICATES the local gate. AGENTS.md already requires
#      `npm run test:isolation` locally whenever RLS or a tenant table is
#      touched — six and a half minutes — and CI then re-ran the same files.
#   3. Blocking bought less than it looked. Every failure that actually reached
#      production did so through a fully green pipeline: the `use server` export
#      that broke module toggling passed lint, tsc, the whole suite AND the
#      build, because it only fails when a request evaluates the action graph.
#
# So the fast gate blocks the merge and the database suite runs on the push to
# `main` afterwards. A failure is found within ~12 minutes of merging rather than
# before it, which is a real reduction in safety and is the accepted trade:
# `main` auto-deploys, so a bad merge is live for that window. Revert-and-fix,
# not catch-before-merge.
#
# THE ESCAPE HATCH: label a pull request `full-tests` and the database suite runs
# on it, blocking as it used to. Use it for anything touching RLS, a migration,
# or a tenant table — the cases where finding out after the deploy is worst.
#
# `if:` rather than a second `paths-ignore`, deliberately. A job skipped by `if:`
# still REPORTS a status, so this stays compatible with branch protection; a
# trigger-level filter reports nothing at all and would wedge a required check
# forever. That is the fix the note below already prescribes.

# DOCUMENTATION-ONLY CHANGES SKIP THE WHOLE WORKFLOW.
#
# The dossiers are updated by nearly every PR (AGENTS.md requires it), and #78
# — two markdown files — spent twenty minutes running the database suite while
# holding the repo-wide `db-tests` slot, so the next real push queued behind a
# docs edit. The build record cannot change behaviour, so its subtrees are
# listed below one by one.
#
# `docs/help/` IS DELIBERATELY NOT IN THE LIST. Those are the tenant guides —
# product content that tests/guides.test.ts checks (every `{{placeholder}}`
# declared, every `**Route:**` valid, every folder a real feature) — so a
# guide-only PR must run CI, or a typo ships straight into the help panel on
# every screen. Listing the build-record subtrees explicitly, rather than
# `docs/**` with a `!docs/help/**` exception, because negation in
# `paths-ignore` is not something to bet CI on. (The older claim that no test
# reads docs/ was already untrue of tests/build-docs.test.ts.)
#
# `paths-ignore` skips a run only when EVERY changed file matches, so a PR that
# touches code and its dossier still runs in full. That is the common case and
# it is unaffected.
#
# Deliberately NOT ignored: `.github/workflows/**`. A change to CI must run CI.
# Also not ignored: any .md outside this list — `public/marketing/README.md` and
# the font NOTICE under src/ still trigger a run. Erring toward running is the
# right bias for a filter whose failure mode is "tests you needed did not run".
#
# ⚠ IF BRANCH PROTECTION IS EVER ADDED, READ THIS FIRST. A run skipped by
# `paths-ignore` never reports a status at all, so a REQUIRED check stays
# permanently "expected" and a docs-only PR can never be merged. There is no
# branch protection on this repo today, which is why this is safe now. If you
# add required checks, replace this with a filter job that computes the changed
# paths and gates the expensive job with `if:`, so a status is always reported.
# The two lists below are duplicated on purpose. A YAML anchor would express it
# once, but GitHub's workflow parser has never reliably supported anchors, and
# the failure mode is CI silently not running. Five repeated lines is cheaper
# than that risk. Keep them in sync.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/*.md"
      - "docs/modules/**"
      - "docs/decisions/**"
      - "docs/briefs/**"
      - "docs/runbooks/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "SETUP.md"
  pull_request:
    # `labeled` is here so the `full-tests` escape hatch works on a PR that is
    # ALREADY OPEN. GitHub evaluates a job's `if:` when the run starts, and the
    # default trigger list — opened, synchronize, reopened — means adding the
    # label to an open PR re-runs nothing and the suite silently stays skipped.
    # Found by labelling PR #101 and watching it report "skipping" anyway.
    # Listing types overrides the defaults, so all four are named.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/*.md"
      - "docs/modules/**"
      - "docs/decisions/**"
      - "docs/briefs/**"
      - "docs/runbooks/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "SETUP.md"

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, build
    runs-on: ubuntu-latest
    # A superseded push has nothing worth waiting for.
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      # Keys are deliberately absent: every provider client is lazy, so the
      # build must stay green without them (AGENTS.md). If this step ever starts
      # needing a secret, something now runs at module scope that should not.
      #
      # This is also the ONLY check that catches a client component importing a
      # `server-only` module — tsc and vitest both pass straight through it.
      #
      # It is NOT a complete server-boundary check, and that was learned the
      # hard way: a `"use server"` file exporting a const throws only when a
      # request evaluates the action graph, so this step passes it. The pure
      # tests below carry `use-server-exports.test.ts`, which is what catches
      # that one.
      - run: npm run build

      # THE PURE PROJECT ONLY — no database, no secrets, a few seconds.
      #
      # Named explicitly rather than relying on the guard to skip the DB files.
      # `database-guard.ts` would delete DATABASE_URL and let them skip quietly,
      # and a suite that skips reports zero failures, which is the shape of a
      # green tick over no coverage. `--project pure` cannot do that: the db
      # files are not selected at all.
      #
      # This includes the two checkers that guard the split itself —
      # db-backed-files.test.ts (recomputes which files touch the database) and
      # use-server-exports.test.ts — so both still run on every pull request.
      - run: npx vitest run --project pure

  # ------------------------------------------------------------------------
  # THE GUARD THIS INCIDENT BOUGHT (2026-08-23).
  #
  # #251 shipped code that queried `production_run_carcasses` together with the
  # migration that creates it. Nothing in the deploy runs migrations — `build`
  # is `next build`, `prebuild` copies the map worker, `vercel.json` is crons —
  # so `main` auto-deployed the code and the table never arrived. Every load of
  # /dashboard/m/production 500'd until #252 reverted it.
  #
  # The whole pipeline was green, and honestly so: nothing it runs can tell
  # whether a migration reached the app database. That is the gap. Until the
  # release pipeline applies migrations itself the step is a human one, and this
  # job exists only to make forgetting it LOUD rather than silent.
  #
  # A migration PR must therefore carry `full-tests`, the same label the header
  # already prescribes for "anything touching RLS, a migration, or a tenant
  # table" — it makes the database suite BLOCK the merge instead of running
  # after it. The label is the acknowledgement; the failure text below is where
  # the ordering rule is written down.
  #
  # Deliberately only `--diff-filter=A`. Editing an already-applied migration is
  # its own, worse problem and a different check; this one is about a NEW file
  # that has to reach two databases by hand before the code needing it goes live.
  migrations:
    name: Migration checklist
    runs-on: ubuntu-latest
    # Pull requests only. On a push to `main` the merge has happened and the
    # deploy is already going out — failing here would paint `main` red without
    # preventing anything.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch has to be present to diff against it.
          fetch-depth: 0

      - name: A new migration must block on the database suite
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          added=$(git diff --name-only --diff-filter=A \
            "origin/${BASE_REF}...HEAD" -- 'drizzle/*.sql')

          if [ -z "$added" ]; then
            echo "No new migration in this pull request."
            exit 0
          fi

          echo "This pull request adds a migration:"
          echo "$added" | sed 's/^/  /'
          echo

          case ",${LABELS}," in
            *,full-tests,*)
              echo "Labelled 'full-tests' — the database suite blocks this merge."
              echo
              echo "REMINDER, because CI cannot check it: the deploy applies no"
              echo "migrations. Run 'npm run db:migrate -- --dev' AND"
              echo "'npm run db:migrate' BEFORE merging, then verify the table in"
              echo "pg_class/pg_policies. 'main' auto-deploys, so code querying a"
              echo "table the app database does not have is live and erroring the"
              echo "moment this merges."
              exit 0
              ;;
          esac

          echo "REFUSING: this pull request adds a migration and is not labelled 'full-tests'."
          echo
          echo "Two things have to happen before it merges, in this order:"
          echo
          echo "  1. Apply it to BOTH databases yourself. Nothing in the deploy"
          echo "     does it: 'npm run db:migrate -- --dev', then"
          echo "     'npm run db:migrate'. Verify the table is really there and"
          echo "     that RLS is enabled AND forced with its policies present."
          echo "  2. Label this pull request 'full-tests', so the database suite"
          echo "     blocks the merge rather than reporting after it."
          echo
          echo "This is the step #251 skipped. The code deployed, the table did"
          echo "not, and /dashboard/m/production was down for five hours."
          exit 1

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    # AFTER a merge, not before. See the header for why, and for the cost.
    # `full-tests` on a pull request opts back into blocking — use it for RLS,
    # migrations, and anything touching a tenant table.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'full-tests')
    # NO `concurrency` GROUP ANY MORE, and its removal is half the point of the
    # change below. The suite used to share ONE Neon branch with every other
    # run, so it had to be serialised repo-wide and three PRs queued for
    # thirty-six minutes. Every run now builds its own Postgres from scratch
    # inside its own runner, so two runs cannot see each other at all — there
    # is nothing left to serialise, and nothing left to leave behind when a run
    # is cancelled.

    # THE DATABASE, IN THE RUNNER.
    #
    # The suite was never CPU-bound; it was waiting. 1465 of 1519 seconds were
    # round trips to Neon, and the SAME suite cost 717s on one run and 1519s on
    # the next because the wire got slower — every file scaling by the same
    # ~2.2x. A latency-bound suite's runtime is a property of the network, not
    # of the code. Here a round trip is sub-millisecond.
    #
    # Postgres 18 to match Neon (`select version()` on the Neon branch reports
    # 18.4). The point of this suite is that it certifies what the DATABASE
    # enforces, so running it on a different major version would be certifying
    # something else.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-owner-not-a-real-secret
          POSTGRES_DB: superapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # THE DRIVER STAYS THE ONE PRODUCTION USES; only the transport changes.
      #
      # The app talks to Neon over a WebSocket, so a test run that swapped in
      # `pg` would certify a driver that ships nowhere — and transaction
      # handling and pooling are exactly what the isolation suite leans on.
      # This proxy speaks that WebSocket protocol and forwards to plain
      # Postgres, so nothing about the application code changes.
      #
      # APPEND_PORT fixes the target: service containers reach each other by
      # service name, while the runner's own steps reach this one on localhost.
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          APPEND_PORT: "postgres:5432"
          ALLOW_ADDR_REGEX: ".*"
          LOG_TRAFFIC: "false"
        ports:
          - 5433:80

    env:
      # Read by scripts/lib/neon-local.ts, from BOTH the provisioning script and
      # the test setup. Every path that does not set it is untouched, which is
      # what keeps a developer's machine and any future real-database run safe.
      NEON_LOCAL_PROXY: localhost:5433
      # NOT SECRETS. This database is created empty, lives inside one runner,
      # and is destroyed with it. Writing the values here rather than as repo
      # secrets means there is nothing to rotate and nothing that could be
      # pointed at something real by accident.
      CI_POSTGRES_OWNER_URL: postgres://postgres:ci-owner-not-a-real-secret@localhost:5432/superapp_test
      CI_APP_USER_PASSWORD: ci-app-user-not-a-real-secret
      TEST_DATABASE_URL_OWNER: postgres://postgres:ci-owner-not-a-real-secret@localhost:5432/superapp_test
      TEST_DATABASE_URL: postgres://app_user:ci-app-user-not-a-real-secret@localhost:5432/superapp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds the whole schema from zero — 136 migrations, 110 tables, 239 RLS
      # policies and the `app_*` context functions the policies read.
      #
      # This is strictly BETTER than the Neon branch it replaces, and not only
      # for speed: that branch was migrated forward run after run and could
      # drift from what a fresh database produces. Building from empty every
      # time means the migration chain itself is exercised on every run, which
      # is the thing that would otherwise be discovered during a production
      # migration. Verified to apply cleanly from zero before this was written.
      - name: Build the schema from zero
        run: npm run db:migrate -- --dev

      # `app_user` is created in SQL, and that is load-bearing rather than
      # ceremonial. The isolation suite certifies that RLS stops one tenant
      # reading another's rows, which is only a test at all if the connection
      # CANNOT bypass RLS. The container's superuser can; so can any role a
      # provider's API would mint. The script refuses to continue if the role it
      # just made can bypass or is a superuser.
      - name: Provision app_user, and prove it cannot bypass RLS
        run: npx tsx scripts/ci-provision-db.ts

      # Module rows, so anything reading `modules` or holding a
      # `tenant_modules.module_id` foreign key has something to point at.
      - name: Seed the module registry
        env:
          DATABASE_URL: postgres://postgres:ci-owner-not-a-real-secret@localhost:5432/superapp_test
        run: npm run db:seed

      # The whole suite, including tests/isolation — the tenant-isolation
      # certification AGENTS.md requires before a deploy.
      #
      # The old "require the secrets" step is gone with the secrets themselves:
      # the database is built by the two steps above, so it cannot be missing,
      # and a suite that silently skipped would now fail at `db:migrate` long
      # before it got here. `database-guard.ts` additionally refuses to run with
      # NEON_LOCAL_PROXY set against any host that is not localhost.
      - name: Run the suite
        env:
          # NOT SECRETS, and deliberately not repo secrets.
          #
          # These three are a key, a key and a salt. The suites that use them
          # create a value and verify it inside the same run, so any input of
          # the right SHAPE satisfies them — 32 bytes of base64, 32+ characters,
          # and any non-empty string. Making them repo secrets would mean the
          # production keys sitting in CI for no benefit, and one more thing to
          # rotate. Writing them here is the safer choice, not the lazy one.
          #
          # The values are fixed rather than random so a failure reproduces.
          APP_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          SHARE_SECRET: ci-test-share-secret-deterministic-not-real-000
          INTERVIEW_IP_SALT: ci-test-interview-salt
        run: npm test
