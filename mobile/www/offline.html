<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yosher</title>
<style>
  html, body { margin: 0; min-height: 100vh; background: #fbfaf7; color: #1f1f1f; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; text-align: center; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .75rem; }
  p { margin: 0 0 1.5rem; line-height: 1.5; color: #555; max-width: 26rem; }
  button { font: inherit; font-weight: 600; color: #fff; background: #13203e; border: 0; border-radius: .75rem; padding: .9rem 1.6rem; }
  button:active { opacity: .85; }
</style>
</head>
<body>
<main>
  <h1>Yosher can't reach the internet</h1>
  <p>Check your connection, then try again. Nothing you saved is affected.</p>
  <button type="button" onclick="location.href='https://yosherapp.com/dashboard'">Try again</button>
</main>
</body>
</html>
